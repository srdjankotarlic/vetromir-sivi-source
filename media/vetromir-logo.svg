  <text x="1200" y="545" text-anchor="middle" fill="#63e3fa" font-family="Avenir Next, Avenir, sans-serif" font-size="58" font-weight="800" letter-spacing="16" filter="url(#shadow)">AVANTURE MRAKOVINE</text>
  <text x="1200" y="645" text-anchor="middle" fill="#faa230" font-family="Avenir Next, Avenir, sans-serif" font-size="38" font-weight="600" letter-spacing="4">KAD VETAR UTIHNE  •  AVANTURA TEK POČINJE</text>
