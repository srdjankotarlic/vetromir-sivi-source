    </filter>
  </defs>
  <g fill="none" stroke="#63e3fa" stroke-linecap="round" filter="url(#glow)">
    <circle cx="1200" cy="145" r="65" stroke-width="8"/>
    <path d="M1166 146 C1176 104 1241 104 1245 139 C1249 171 1212 188 1190 168 C1174 153 1181 137 1197 132" stroke-width="12"/>
  </g>
